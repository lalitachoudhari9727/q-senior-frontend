<!-- filter-bar.component.html -->
<form [formGroup]="form" class="filter-bar">
  <ng-container *ngFor="let field of fields">
    <ng-container [ngSwitch]="field.type">
      <mat-form-field *ngSwitchCase="'text'" appearance="outline">
        <mat-label>{{ field.label }}</mat-label>
        <input matInput [formControlName]="field.key" />
      </mat-form-field>
 
      <!-- Single Select -->

      <mat-form-field *ngSwitchCase="'select'" appearance="outline">
        <mat-label>{{ field.label }}</mat-label>
        <mat-select [formControlName]="field.key">
          <mat-option [value]="null">-- {{ field.label }} --</mat-option>
          <mat-option *ngFor="let opt of field.options" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Multi Select -->
      <mat-form-field *ngSwitchCase="'multiselect'" appearance="outline">
        <mat-label>{{ field.label }}</mat-label>
        <mat-select [formControlName]="field.key" multiple>
          <mat-option *ngFor="let opt of field.options" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Checkbox -->
      <mat-checkbox *ngSwitchCase="'checkbox'" [formControlName]="field.key">
        {{ field.label }}
      </mat-checkbox>
    </ng-container>
  </ng-container>

  <div>
    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="onApplyFilterClicked()"
      class="outlined-button"
    >
      Apply Filter
    </button>
  </div>
</form>
